      <rect x="438" y="176" width="174" height="88" rx="19" fill="#e2ecdd" stroke="#648b71" stroke-width="2.5"/><text x="525" y="231.9" font-size="34" font-weight="500" fill="#2b4437" text-anchor="middle">QKᵀ / √d</text>
