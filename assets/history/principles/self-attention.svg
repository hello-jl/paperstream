<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="self-attention-title self-attention-desc">
<title id="self-attention-title">自注意力</title><desc id="self-attention-desc">同一输入 X 分别投影为 Q、K、V。QK 转置除以根号 d 得到相似度，softmax 得到权重，再加权 V 得到输出 Y。省略掩码、多头拼接及输出投影。</desc>
<metadata>Original illustration: Paperstream contributors. MIT License: https://opensource.org/license/mit</metadata>
