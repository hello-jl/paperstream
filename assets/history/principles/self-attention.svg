      <rect x="256" y="133" width="85" height="68" rx="19" fill="#ffffff" stroke="#b7cbb5" stroke-width="2.5"/><text x="298.5" y="181" font-size="40" font-weight="500" fill="#2b4437" text-anchor="middle">Q</text><rect x="256" y="238" width="85" height="68" rx="19" fill="#ffffff" stroke="#b7cbb5" stroke-width="2.5"/><text x="298.5" y="286" font-size="40" font-weight="500" fill="#2b4437" text-anchor="middle">K</text><rect x="256" y="343" width="85" height="68" rx="19" fill="#ffffff" stroke="#b7cbb5" stroke-width="2.5"/><text x="298.5" y="391" font-size="40" font-weight="500" fill="#2b4437" text-anchor="middle">V</text>
