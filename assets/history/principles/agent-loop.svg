<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="agent-loop-title agent-loop-desc">
<title id="agent-loop-title">Agent 工作循环</title><desc id="agent-loop-desc">任务进入模型，模型调用工具，环境结果返回模型；模型可以继续循环或退出并完成任务。这是通用 Agent 工作循环，不是 Claude 内部架构。</desc>
<metadata>Original illustration: Paperstream contributors. MIT License: https://opensource.org/license/mit</metadata>
