      <rect x="530" y="215" width="140" height="80" rx="19" fill="#ffffff" stroke="#b7cbb5" stroke-width="2.5"/><text x="600" y="267.6" font-size="36" font-weight="500" fill="#2b4437" text-anchor="middle">工具</text>
      <path d="M686 255H702" fill="none" stroke="#648b71" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
